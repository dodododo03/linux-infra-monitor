name: CI - Build and Push Docker Images

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 문법 검사
        run: python -m py_compile collector/collector.py dashboard/app.py

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}   # 비밀번호 대신 Access Token

      # latest + 커밋 SHA 태그를 함께 붙인다 → 문제 생기면 이전 SHA로 롤백 가능
      - name: Build and Push Collector
        uses: docker/build-push-action@v6
        with:
          context: ./collector
          push: true
          tags: |
            dki9/linux-collector:latest
            dki9/linux-collector:${{ github.sha }}

      - name: Build and Push Dashboard
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          push: true
          tags: |
            dki9/linux-dashboard:latest
            dki9/linux-dashboard:${{ github.sha }}
